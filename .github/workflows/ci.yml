name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
        swift-version:
          - 6.1.0

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }}, Swift ${{ matrix.swift-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Linux apt dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Setup Swift on Linux
        if: matrix.os == 'ubuntu-latest'
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: ${{ matrix.swift-version }}
      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

  conformance:
    timeout-minutes: 10
    runs-on: macos-15
    name: MCP Conformance Tests

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run pinned MCP 2026 conformance tests
        run: scripts/run-conformance.sh --mode both

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-2026-conformance
          path: .build/conformance-results
          if-no-files-found: error

  documentation:
    name: Documentation
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build Documentation
        run: swift package generate-documentation --target MCP --warnings-as-errors

  static-linux-sdk-build:
    name: Linux Static SDK Build (${{ matrix.swift-version }} - ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest]
        swift-version:
          - 6.1.2
    runs-on: ${{ matrix.os }}
    container: swift:${{ matrix.swift-version }}-noble
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install static SDK and build
        env:
          BUILD_FLAGS: ""
        run: |
          which curl || (apt -q update && apt -yq install curl)
          curl -s --retry 3 https://raw.githubusercontent.com/swiftlang/github-workflows/refs/heads/main/.github/workflows/scripts/install-and-build-with-sdk.sh | \
          bash -s -- --static --flags="$BUILD_FLAGS" ${{ matrix.swift-version }}
